<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Самопознание</title>
    <style>
        /* === Общие стили === */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7fc; color: #333; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: white; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); padding: 20px; }
        h1 { text-align: center; color: #4a6fa5; margin-bottom: 20px; }
        .tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; border-bottom: 2px solid #e0e7ef; padding-bottom: 10px; }
        .tab-btn { padding: 10px 16px; background: #eef2f7; border: none; border-radius: 30px; cursor: pointer; font-weight: 600; color: #4a6fa5; transition: 0.2s; }
        .tab-btn.active { background: #4a6fa5; color: white; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        textarea, input[type="text"], input[type="password"], input[type="email"], select { width: 100%; padding: 12px; border: 1px solid #d0d7e2; border-radius: 12px; font-size: 16px; margin: 8px 0; }
        button { background: #4a6fa5; color: white; border: none; padding: 12px 24px; border-radius: 30px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        button:hover { background: #3a5a8a; }
        .message { padding: 12px; border-radius: 12px; margin: 10px 0; }
        .message.user { background: #e3ecf5; }
        .message.bot { background: #f0f4fa; }
        .history-item { background: #f8faff; border-radius: 12px; padding: 12px; margin: 8px 0; border-left: 4px solid #4a6fa5; }
        .flex { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
        .badge { background: #ffd966; padding: 4px 12px; border-radius: 30px; font-size: 14px; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #4a6fa5; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 20px auto; display: none; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
<div class="container" id="app">
    <h1>🧠 Самопознание</h1>

    <div class="tabs" id="tabs">
        <button class="tab-btn active" data-tab="auth">Вход</button>
        <button class="tab-btn" data-tab="psychologist">Психолог</button>
        <button class="tab-btn" data-tab="tutor">Наставник</button>
        <button class="tab-btn" data-tab="history">История</button>
        <button class="tab-btn" data-tab="settings">Настройки</button>
        <button class="tab-btn" data-tab="pair">Пары</button>
        <button class="tab-btn" data-tab="support">Поддержка</button>
        <button class="tab-btn" data-tab="admin">Админ</button>
    </div>

    <!-- Вкладка: Вход / Регистрация -->
    <div id="tab-auth" class="tab-content active">
        <h3>Авторизация</h3>
        <div id="auth-form">
            <input type="email" id="login-email" placeholder="Email" required>
            <input type="password" id="login-password" placeholder="Пароль" required>
            <button id="login-btn">Войти</button>
            <hr>
            <p>Нет аккаунта? <a href="#" id="show-register">Зарегистрироваться</a></p>
        </div>
        <div id="register-form" style="display:none;">
            <input type="text" id="reg-name" placeholder="Имя">
            <input type="email" id="reg-email" placeholder="Email" required>
            <input type="password" id="reg-password" placeholder="Пароль" required>
            <button id="register-btn">Зарегистрироваться</button>
            <p><a href="#" id="show-login">Уже есть аккаунт? Войти</a></p>
        </div>
        <div id="verify-section" style="display:none;">
            <p>Введите код из письма:</p>
            <input type="text" id="verify-code" placeholder="6 цифр">
            <button id="verify-btn">Подтвердить</button>
        </div>
        <div id="auth-status" class="message"></div>
    </div>

    <!-- Вкладка: Психолог -->
    <div id="tab-psychologist" class="tab-content">
        <h3>💬 Психолог Вероника</h3>
        <div id="psycho-chat" style="max-height:400px; overflow-y:auto; background:#f9fbfd; border-radius:12px; padding:10px; margin-bottom:10px;"></div>
        <textarea id="psycho-input" rows="3" placeholder="Напишите, что вас беспокоит..."></textarea>
        <div class="flex">
            <button id="psycho-send">Отправить</button>
            <button id="psycho-voice">🎤 Голос</button>
        </div>
        <div id="psycho-limits" style="font-size:14px; color:#666; margin-top:8px;"></div>
        <audio id="psycho-audio" controls style="width:100%; margin-top:10px; display:none;"></audio>
    </div>

    <!-- Вкладка: Наставник -->
    <div id="tab-tutor" class="tab-content">
        <h3>📚 Наставник Вероника</h3>
        <div class="flex">
            <select id="tutor-subject">
                <option value="">Общий</option>
                <option value="Математика">Математика</option>
                <option value="Физика">Физика</option>
                <option value="Химия">Химия</option>
                <option value="Биология">Биология</option>
                <option value="История">История</option>
                <option value="Литература">Литература</option>
                <option value="Английский">Английский</option>
                <option value="Программирование">Программирование</option>
            </select>
            <label><input type="checkbox" id="tutor-live"> Лекция (расходует минуты)</label>
        </div>
        <div id="tutor-chat" style="max-height:400px; overflow-y:auto; background:#f9fbfd; border-radius:12px; padding:10px; margin-bottom:10px;"></div>
        <textarea id="tutor-input" rows="3" placeholder="Задайте вопрос по предмету..."></textarea>
        <div class="flex">
            <button id="tutor-send">Отправить</button>
            <button id="tutor-voice">🎤 Голос</button>
            <button id="tutor-grammar">📝 Проверить грамматику</button>
        </div>
        <div id="tutor-info" style="font-size:14px; color:#666; margin-top:8px;">Баланс минут: <span id="tutor-minutes">0</span></div>
        <div id="tutor-notes-area" style="margin-top:15px;">
            <h4>Заметки к сессии</h4>
            <input type="text" id="note-text" placeholder="Текст заметки">
            <button id="note-save">Сохранить заметку</button>
            <div id="notes-list"></div>
        </div>
        <div id="tutor-marks-area" style="margin-top:15px;">
            <h4>Пометки</h4>
            <select id="mark-color">
                <option value="blue">Синяя</option>
                <option value="red">Красная</option>
                <option value="green">Зелёная</option>
                <option value="yellow">Жёлтая</option>
            </select>
            <input type="text" id="mark-label" placeholder="Метка (необязательно)">
            <button id="mark-save">Добавить пометку</button>
            <div id="marks-list"></div>
        </div>
    </div>

    <!-- Вкладка: История -->
    <div id="tab-history" class="tab-content">
        <h3>📜 История сессий</h3>
        <div class="flex">
            <button id="history-psycho">Психолог</button>
            <button id="history-tutor">Наставник</button>
        </div>
        <div id="history-container"></div>
    </div>

    <!-- Вкладка: Настройки -->
    <div id="tab-settings" class="tab-content">
        <h3>⚙️ Настройки</h3>
        <div>
            <label>Имя: <input type="text" id="settings-name"></label>
            <label><input type="checkbox" id="settings-voice"> Голосовые ответы</label>
            <button id="settings-save">Сохранить</button>
        </div>
        <hr>
        <button id="settings-delete" style="background:#c0392b;">Удалить все мои данные</button>
        <div id="profile-info"></div>
    </div>

    <!-- Вкладка: Пары -->
    <div id="tab-pair" class="tab-content">
        <h3>👫 Парные сессии</h3>
        <button id="pair-invite">Создать код приглашения</button>
        <input type="text" id="pair-code" placeholder="Введите код партнёра">
        <button id="pair-connect">Подключиться</button>
        <button id="pair-disconnect">Отключиться</button>
        <div id="pair-status"></div>
        <textarea id="pair-input" rows="3" placeholder="Сообщение для партнёра..."></textarea>
        <button id="pair-send">Отправить</button>
        <div id="pair-chat"></div>
    </div>

    <!-- Вкладка: Поддержка -->
    <div id="tab-support" class="tab-content">
        <h3>📧 Поддержка</h3>
        <textarea id="support-input" rows="3" placeholder="Ваше сообщение..."></textarea>
        <button id="support-send">Отправить</button>
        <div id="support-messages"></div>
    </div>

    <!-- Вкладка: Админ -->
    <div id="tab-admin" class="tab-content">
        <h3>🔐 Админ-панель</h3>
        <input type="password" id="admin-pass" placeholder="Пароль админа">
        <button id="admin-stats">Статистика</button>
        <div id="admin-result"></div>
    </div>

    <div id="global-loader" class="loader"></div>
</div>

<script>
// ============================================================
// КОНСТАНТА: АДРЕС БЭКЕНДА НА RELAXDEV
// ============================================================
const API_BASE = 'https://voice-psychologist.relaxdev.ru'; // 🔥 ЗАМЕНИТЕ НА РЕАЛЬНЫЙ URL

// ============================================================
// Глобальные переменные
// ============================================================
let token = localStorage.getItem('token') || '';
let currentUserId = null;
let currentSessionId = null;

// ============================================================
// Вспомогательные функции (все запросы идут через API_BASE)
// ============================================================
function apiCall(method, endpoint, body = null, isForm = false) {
    const options = {
        method: method,
        headers: {
            'Authorization': `Bearer ${token}`,
        },
    };
    if (body) {
        if (isForm) {
            options.body = body;
        } else {
            options.headers['Content-Type'] = 'application/json';
            options.body = JSON.stringify(body);
        }
    }
    return fetch(API_BASE + endpoint, options).then(r => r.json());
}

function showTab(tabId) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    document.getElementById('tab-' + tabId).classList.add('active');
    document.querySelector(`[data-tab="${tabId}"]`).classList.add('active');
}

function addMessage(container, text, isUser = true, extra = '') {
    const div = document.createElement('div');
    div.className = `message ${isUser ? 'user' : 'bot'}`;
    div.innerHTML = `<strong>${isUser ? 'Вы' : 'Вероника'}:</strong> ${text} ${extra}`;
    container.appendChild(div);
    container.scrollTop = container.scrollHeight;
}

function showLoader(show) {
    document.getElementById('global-loader').style.display = show ? 'block' : 'none';
}

function formatDate(iso) {
    return new Date(iso).toLocaleString('ru-RU');
}

// ============================================================
// Авторизация
// ============================================================
document.getElementById('login-btn').addEventListener('click', () => {
    const email = document.getElementById('login-email').value;
    const password = document.getElementById('login-password').value;
    if (!email || !password) return alert('Заполните все поля');
    showLoader(true);
    const form = new FormData();
    form.append('login', email);
    form.append('password', password);
    fetch(API_BASE + '/auth/login', { method: 'POST', body: form })
        .then(r => r.json())
        .then(data => {
            if (data.access_token) {
                token = data.access_token;
                localStorage.setItem('token', token);
                document.getElementById('auth-status').innerHTML = '<div class="message bot">✅ Вход выполнен</div>';
                loadProfile();
                showTab('psychologist');
            } else {
                document.getElementById('auth-status').innerHTML = `<div class="message user">❌ ${data.detail || 'Ошибка'}</div>`;
            }
            showLoader(false);
        });
});

document.getElementById('register-btn').addEventListener('click', () => {
    const name = document.getElementById('reg-name').value || 'Пользователь';
    const email = document.getElementById('reg-email').value;
    const password = document.getElementById('reg-password').value;
    if (!email || !password) return alert('Заполните все поля');
    showLoader(true);
    fetch(API_BASE + '/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password, name })
    })
    .then(r => r.json())
    .then(data => {
        if (data.message) {
            document.getElementById('auth-status').innerHTML = `<div class="message bot">✅ ${data.message}</div>`;
            document.getElementById('verify-section').style.display = 'block';
            document.getElementById('verify-section').dataset.email = email;
        } else {
            document.getElementById('auth-status').innerHTML = `<div class="message user">❌ ${data.detail || 'Ошибка'}</div>`;
        }
        showLoader(false);
    });
});

document.getElementById('verify-btn').addEventListener('click', () => {
    const email = document.getElementById('verify-section').dataset.email;
    const code = document.getElementById('verify-code').value;
    if (!code) return alert('Введите код');
    const form = new FormData();
    form.append('email', email);
    form.append('code', code);
    showLoader(true);
    fetch(API_BASE + '/auth/verify-email', { method: 'POST', body: form })
        .then(r => r.json())
        .then(data => {
            if (data.access_token) {
                token = data.access_token;
                localStorage.setItem('token', token);
                document.getElementById('auth-status').innerHTML = '<div class="message bot">✅ Email подтверждён, вход выполнен</div>';
                loadProfile();
                showTab('psychologist');
            } else {
                document.getElementById('auth-status').innerHTML = `<div class="message user">❌ ${data.detail || 'Ошибка'}</div>`;
            }
            showLoader(false);
        });
});

document.getElementById('show-register').addEventListener('click', (e) => {
    e.preventDefault();
    document.getElementById('auth-form').style.display = 'none';
    document.getElementById('register-form').style.display = 'block';
});
document.getElementById('show-login').addEventListener('click', (e) => {
    e.preventDefault();
    document.getElementById('register-form').style.display = 'none';
    document.getElementById('auth-form').style.display = 'block';
});

// ============================================================
// Загрузка профиля и лимитов
// ============================================================
function loadProfile() {
    if (!token) return;
    apiCall('GET', '/auth/me')
        .then(data => {
            if (data.id) {
                currentUserId = data.id;
                document.getElementById('settings-name').value = data.name || '';
                document.getElementById('settings-voice').checked = data.voice_responses_enabled !== false;
                document.getElementById('profile-info').innerHTML = `
                    <p>Email: ${data.email || '—'}</p>
                    <p>Психолог: ${data.psychologist_subscription} (до ${data.psychologist_end ? formatDate(data.psychologist_end) : '—'})</p>
                    <p>Наставник: ${data.tutor_subscription} (до ${data.tutor_end ? formatDate(data.tutor_end) : '—'})</p>
                    <p>Минуты наставника: ${data.tutor_minutes_balance}</p>
                `;
                document.getElementById('tutor-minutes').textContent = data.tutor_minutes_balance;
                loadLimits();
            }
        });
}

function loadLimits() {
    apiCall('GET', '/limits')
        .then(data => {
            document.getElementById('psycho-limits').innerHTML = `
                Голосовых сегодня: ${data.voice_used}/${data.voice_limit} |
                Загрузок аудио: ${data.upload_used}/${data.upload_limit} |
                Минут наставника: ${data.tutor_minutes}
            `;
        });
}

// ============================================================
// Переключение вкладок
// ============================================================
document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        const tab = btn.dataset.tab;
        showTab(tab);
        if (tab === 'settings') loadProfile();
        if (tab === 'history') loadHistory('psychologist');
        if (tab === 'tutor') loadTutorNotesMarks();
    });
});

// ============================================================
// Психолог
// ============================================================
document.getElementById('psycho-send').addEventListener('click', sendPsychoMessage);
document.getElementById('psycho-input').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendPsychoMessage(); }
});

function sendPsychoMessage() {
    const input = document.getElementById('psycho-input');
    const text = input.value.trim();
    if (!text) return;
    const chat = document.getElementById('psycho-chat');
    addMessage(chat, text, true);
    input.value = '';
    showLoader(true);
    const form = new FormData();
    form.append('text', text);
    fetch(API_BASE + '/psychologist/chat', { method: 'POST', headers: { 'Authorization': `Bearer ${token}` }, body: form })
        .then(r => r.json())
        .then(data => {
            if (data.response) {
                addMessage(chat, data.response, false);
                if (data.audio) {
                    const audioEl = document.getElementById('psycho-audio');
                    audioEl.src = 'data:audio/mpeg;base64,' + data.audio;
                    audioEl.style.display = 'block';
                    audioEl.play();
                }
                if (data.limits) {
                    document.getElementById('psycho-limits').innerHTML = `
                        Голосовых сегодня: ${data.limits.voice_used}/${data.limits.voice_limit} |
                        Загрузок аудио: ${data.limits.upload_used}/${data.limits.upload_limit}
                    `;
                }
                loadLimits();
            } else if (data.error) {
                addMessage(chat, '❌ ' + data.error, false);
            }
            showLoader(false);
        });
}

document.getElementById('psycho-voice').addEventListener('click', () => {
    alert('Функция голосового ввода требует реализации через MediaRecorder. Пока отправьте текст.');
});

// ============================================================
// Наставник
// ============================================================
document.getElementById('tutor-send').addEventListener('click', sendTutorMessage);
document.getElementById('tutor-input').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendTutorMessage(); }
});

function sendTutorMessage() {
    const input = document.getElementById('tutor-input');
    const text = input.value.trim();
    if (!text) return;
    const subject = document.getElementById('tutor-subject').value;
    const isLive = document.getElementById('tutor-live').checked;
    const chat = document.getElementById('tutor-chat');
    addMessage(chat, text, true);
    input.value = '';
    showLoader(true);
    const form = new FormData();
    form.append('text', text);
    if (subject) form.append('subject', subject);
    form.append('is_live', isLive ? 'true' : 'false');
    fetch(API_BASE + '/tutor/chat', { method: 'POST', headers: { 'Authorization': `Bearer ${token}` }, body: form })
        .then(r => r.json())
        .then(data => {
            if (data.response) {
                addMessage(chat, data.response, false);
                if (data.minutes_balance !== undefined) {
                    document.getElementById('tutor-minutes').textContent = data.minutes_balance;
                }
                loadLimits();
            } else if (data.error) {
                addMessage(chat, '❌ ' + data.error, false);
            }
            showLoader(false);
        });
}

document.getElementById('tutor-voice').addEventListener('click', () => {
    alert('Голосовой ввод для наставника пока реализуется. Используйте текстовый ввод.');
});

document.getElementById('tutor-grammar').addEventListener('click', () => {
    const input = document.getElementById('tutor-input');
    const text = input.value.trim();
    if (!text) return alert('Введите текст для проверки');
    showLoader(true);
    const form = new FormData();
    form.append('text', text);
    fetch(API_BASE + '/tutor/grammar', { method: 'POST', headers: { 'Authorization': `Bearer ${token}` }, body: form })
        .then(r => r.json())
        .then(data => {
            const chat = document.getElementById('tutor-chat');
            if (data.response) {
                addMessage(chat, '📝 Проверка грамматики:\n' + data.response, false);
            } else if (data.error) {
                addMessage(chat, '❌ ' + data.error, false);
            }
            showLoader(false);
        });
});

// Заметки и пометки
function loadTutorNotesMarks() {
    apiCall('GET', '/tutor/notes')
        .then(data => {
            const list = document.getElementById('notes-list');
            list.innerHTML = '';
            (data.notes || []).forEach(n => {
                const div = document.createElement('div');
                div.className = 'history-item';
                div.innerHTML = `<strong>${formatDate(n.date)}</strong> (${n.color}): ${n.text}`;
                list.appendChild(div);
            });
        });
    apiCall('GET', '/tutor/marks')
        .then(data => {
            const list = document.getElementById('marks-list');
            list.innerHTML = '';
            (data.marks || []).forEach(m => {
                const div = document.createElement('div');
                div.className = 'history-item';
                div.innerHTML = `<strong>${formatDate(m.date)}</strong> (${m.color}): ${m.label || '—'}`;
                list.appendChild(div);
            });
        });
}

document.getElementById('note-save').addEventListener('click', () => {
    const text = document.getElementById('note-text').value.trim();
    if (!text) return alert('Введите текст заметки');
    if (!currentSessionId) {
        alert('Сначала отправьте сообщение наставнику, чтобы создать сессию.');
        return;
    }
    const form = new FormData();
    form.append('session_id', currentSessionId);
    form.append('text', text);
    form.append('color', 'yellow');
    showLoader(true);
    fetch(API_BASE + '/tutor/notes', { method: 'POST', headers: { 'Authorization': `Bearer ${token}` }, body: form })
        .then(r => r.json())
        .then(data => {
            if (data.status === 'ok') {
                document.getElementById('note-text').value = '';
                loadTutorNotesMarks();
            }
            showLoader(false);
        });
});

document.getElementById('mark-save').addEventListener('click', () => {
    const color = document.getElementById('mark-color').value;
    const label = document.getElementById('mark-label').value.trim();
    if (!currentSessionId) {
        alert('Сначала отправьте сообщение наставнику.');
        return;
    }
    const form = new FormData();
    form.append('session_id', currentSessionId);
    form.append('color', color);
    if (label) form.append('label', label);
    showLoader(true);
    fetch(API_BASE + '/tutor/marks', { method: 'POST', headers: { 'Authorization': `Bearer ${token}` }, body: form })
        .then(r => r.json())
        .then(data => {
            if (data.status === 'ok') {
                document.getElementById('mark-label').value = '';
                loadTutorNotesMarks();
            }
            showLoader(false);
        });
});

// ============================================================
// История
// ============================================================
function loadHistory(mode) {
    const container = document.getElementById('history-container');
    container.innerHTML = '<div class="loader" style="display:block;"></div>';
    const endpoint = mode === 'psychologist' ? '/history' : '/tutor/history';
    apiCall('GET', endpoint)
        .then(data => {
            container.innerHTML = '';
            const sessions = data.sessions || [];
            if (!sessions.length) {
                container.innerHTML = '<p>Нет сессий.</p>';
                return;
            }
            sessions.forEach(s => {
                const div = document.createElement('div');
                div.className = 'history-item';
                div.innerHTML = `
                    <strong>${formatDate(s.date)}</strong>
                    <p><strong>Вы:</strong> ${s.text}</p>
                    <p><strong>Вероника:</strong> ${s.response}</p>
                    ${s.mood_score ? `<p>Настроение: ${s.mood_score}/10</p>` : ''}
                    ${s.subject ? `<p>Предмет: ${s.subject}</p>` : ''}
                    ${s.is_live ? '<span class="badge">Лекция</span>' : ''}
                `;
                container.appendChild(div);
            });
        });
}

document.getElementById('history-psycho').addEventListener('click', () => loadHistory('psychologist'));
document.getElementById('history-tutor').addEventListener('click', () => loadHistory('tutor'));

// ============================================================
// Настройки
// ============================================================
document.getElementById('settings-save').addEventListener('click', () => {
    const name = document.getElementById('settings-name').value;
    const voice = document.getElementById('settings-voice').checked;
    const form = new FormData();
    form.append('name', name);
    form.append('voice_responses', voice ? 'true' : 'false');
    showLoader(true);
    fetch(API_BASE + '/settings/update', { method: 'POST', headers: { 'Authorization': `Bearer ${token}` }, body: form })
        .then(r => r.json())
        .then(data => {
            if (data.status === 'ok') {
                alert('Настройки сохранены');
                loadProfile();
            }
            showLoader(false);
        });
});

document.getElementById('settings-delete').addEventListener('click', () => {
    if (!confirm('Удалить все данные (сессии, эмоции, заметки, пометки)?')) return;
    showLoader(true);
    fetch(API_BASE + '/settings/delete_all', { method: 'POST', headers: { 'Authorization': `Bearer ${token}` } })
        .then(r => r.json())
        .then(data => {
            alert('Данные удалены');
            showLoader(false);
        });
});

// ============================================================
// Пары
// ============================================================
document.getElementById('pair-invite').addEventListener('click', () => {
    apiCall('POST', '/pair/invite')
        .then(data => {
            document.getElementById('pair-status').innerHTML = `Ваш код: <strong>${data.code}</strong>`;
        });
});

document.getElementById('pair-connect').addEventListener('click', () => {
    const code = document.getElementById('pair-code').value.trim();
    if (!code) return alert('Введите код');
    const form = new FormData();
    form.append('code', code);
    showLoader(true);
    fetch(API_BASE + '/pair/connect', { method: 'POST', headers: { 'Authorization': `Bearer ${token}` }, body: form })
        .then(r => r.json())
        .then(data => {
            if (data.status === 'connected') {
                document.getElementById('pair-status').innerHTML = `Связаны с ${data.partner_name}`;
            } else {
                alert(data.detail || 'Ошибка');
            }
            showLoader(false);
        });
});

document.getElementById('pair-disconnect').addEventListener('click', () => {
    showLoader(true);
    fetch(API_BASE + '/pair/disconnect', { method: 'POST', headers: { 'Authorization': `Bearer ${token}` } })
        .then(r => r.json())
        .then(data => {
            document.getElementById('pair-status').innerHTML = 'Отключены';
            showLoader(false);
        });
});

document.getElementById('pair-send').addEventListener('click', () => {
    const text = document.getElementById('pair-input').value.trim();
    if (!text) return;
    const form = new FormData();
    form.append('text', text);
    showLoader(true);
    fetch(API_BASE + '/pair/session', { method: 'POST', headers: { 'Authorization': `Bearer ${token}` }, body: form })
        .then(r => r.json())
        .then(data => {
            const chat = document.getElementById('pair-chat');
            addMessage(chat, text, true);
            if (data.response) addMessage(chat, data.response, false);
            else if (data.error) addMessage(chat, '❌ ' + data.error, false);
            showLoader(false);
        });
});

// ============================================================
// Поддержка
// ============================================================
document.getElementById('support-send').addEventListener('click', () => {
    const text = document.getElementById('support-input').value.trim();
    if (!text) return;
    const form = new FormData();
    form.append('text', text);
    showLoader(true);
    fetch(API_BASE + '/support/send', { method: 'POST', headers: { 'Authorization': `Bearer ${token}` }, body: form })
        .then(r => r.json())
        .then(data => {
            if (data.status === 'ok') {
                document.getElementById('support-input').value = '';
                loadSupportMessages();
            }
            showLoader(false);
        });
});

function loadSupportMessages() {
    apiCall('GET', '/support/messages')
        .then(data => {
            const container = document.getElementById('support-messages');
            container.innerHTML = '';
            (data.messages || []).forEach(m => {
                const div = document.createElement('div');
                div.className = `message ${m.is_from_user ? 'user' : 'bot'}`;
                div.innerHTML = `<strong>${m.is_from_user ? 'Вы' : 'Поддержка'}:</strong> ${m.text} ${m.reply ? '<br><em>Ответ: ' + m.reply + '</em>' : ''}`;
                container.appendChild(div);
            });
        });
}

// ============================================================
// Админка
// ============================================================
document.getElementById('admin-stats').addEventListener('click', () => {
    const password = document.getElementById('admin-pass').value;
    if (!password) return alert('Введите пароль админа');
    showLoader(true);
    fetch(API_BASE + '/admin/stats?password=' + encodeURIComponent(password))
        .then(r => r.json())
        .then(data => {
            document.getElementById('admin-result').innerHTML = `
                <p>Пользователей: ${data.users}</p>
                <p>Сессий: ${data.sessions}</p>
                <p>Платежей: ${data.payments}</p>
                <p>Активных за сегодня: ${data.active_today}</p>
            `;
            showLoader(false);
        });
});

// ============================================================
// Инициализация
// ============================================================
if (token) {
    loadProfile();
    showTab('psychologist');
} else {
    showTab('auth');
}

setInterval(loadLimits, 30000);
